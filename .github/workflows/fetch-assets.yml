name: Fetch real photos into the repo

# Manual run: Actions tab → "Fetch real photos into the repo" → Run workflow.
# Downloads the originals from the old site (GitHub runners have normal
# internet access) and commits them to main, replacing the placeholders.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/fetch-assets-trigger']

permissions:
  contents: write

# A new run cancels any stuck predecessor (the old host has tar-pitted
# connections before; timeout-minutes is the backstop).
concurrency:
  group: fetch-assets
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download photos from the old site
        working-directory: site
        run: node scripts/fetch-assets.mjs

      - name: Install dependencies (sharp, for thumbnails)
        working-directory: site
        run: npm ci

      - name: Generate hero-candidate review thumbnails
        working-directory: site
        run: node scripts/make-hero-candidates.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/assets/photos design/hero-candidates
          if git diff --cached --quiet; then
            echo "No changes — photos already current."
          else
            git commit -m "Commit real photos and hero-candidate thumbnails"
            git pull --rebase origin main
            git push origin main
          fi
