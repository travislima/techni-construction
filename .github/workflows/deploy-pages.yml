name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # GitHub's runners have normal internet access, so swap the committed
      # placeholder images for the real photos from the old site.
      - name: Fetch real photos (best effort)
        working-directory: site
        continue-on-error: true
        run: node scripts/fetch-assets.mjs

      # Guard: never deploy a build without the real photos — a failed fetch
      # must keep the last good deployment live, not replace it with grey
      # placeholders. (Sentinel: the hero photo is ~1.5 MB; placeholders and
      # block pages are under 100 KB.)
      - name: Require real photos before deploying
        run: |
          size=$(stat -c%s site/src/assets/photos/venter-1.jpg)
          echo "venter-1.jpg is ${size} bytes"
          if [ "$size" -lt 100000 ]; then
            echo "Real photos unavailable this run — refusing to deploy placeholders over the live site."
            exit 1
          fi

      - name: Build
        working-directory: site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # This is a staging URL — keep it out of search engines so it never
      # competes with the real domain.
      - name: Noindex staging
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/dist/robots.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
